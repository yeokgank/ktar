<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#04102a}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
/* KTAR 히어로 영상 (자체 제작) — 시험·평가·인증 과정을 상징.
   측정 패널(파형·게이지) → 점검 항목 체크 → 스캔 라인 → 인증(방패+체크) 완료. 글자 없음.
   render(t) 는 t∈[0,1) 에서 완전히 반복된다(콘텐츠는 t≈0 / t≈1 에서 투명). */
const W = 1920, H = 1080, TAU = Math.PI * 2;
const main = document.getElementById('c').getContext('2d');
const off = document.createElement('canvas'); off.width = W; off.height = H;
const ctx = off.getContext('2d');

let seed = 5;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const sstep = (a, b, x) => { const u = clamp((x - a) / (b - a)); return u * u * (3 - 2 * u); };
const easeOutBack = (u) => { const c = 1.70158; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); };
const mod = (a, n) => ((a % n) + n) % n;

const CY = '103,214,255', BL = '59,130,246', GR = '52,211,153', WH = '255,255,255';
const PX = 1160, PY = 190, PW = 520, PH = 640; // 측정 패널

const DUST = Array.from({ length: 110 }, () => ({ x: rnd() * W, y: rnd() * H, r: 0.8 + rnd() * 2.2, a: 0.2 + rnd() * 0.6, p: rnd() * TAU }));
const ROW_T = [0.14, 0.27, 0.40, 0.53, 0.66]; // 점검 항목 완료 시점
const BARW = [0.78, 0.62, 0.9, 0.7, 0.84]; // 항목 옆 값 자리표시 길이

function glow(x, y, r, col, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${col},${a})`); g.addColorStop(0.4, `rgba(${col},${a * 0.4})`); g.addColorStop(1, `rgba(${col},0)`);
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

function drawScene(t) {
  const gA = sstep(0.0, 0.05, t) * (1 - sstep(0.93, 0.985, t)); // 콘텐츠 가시도

  // 배경
  const bg = ctx.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, '#040d26'); bg.addColorStop(0.55, '#0a2558'); bg.addColorStop(1, '#0b3f86');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  glow(1420, 470, 760, BL, 0.32); glow(1700, 880, 520, CY, 0.12); glow(500, 900, 520, BL, 0.12);

  // 바닥 원근 격자
  const VPY = 640;
  ctx.lineWidth = 1;
  for (let j = 0; j <= 14; j++) {
    const u = (j + t) / 14; if (u > 1) continue;
    const y = VPY + (H - VPY) * u * u;
    ctx.strokeStyle = `rgba(${CY},${0.05 + 0.2 * u})`;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  for (let i = -16; i <= 16; i++) {
    ctx.strokeStyle = `rgba(${CY},0.09)`;
    ctx.beginPath(); ctx.moveTo(W / 2 + i * 40, VPY); ctx.lineTo(W / 2 + i * 260, H); ctx.stroke();
  }

  // 먼지 입자
  DUST.forEach((d) => {
    const y = mod(d.y - t * H, H), x = d.x + 14 * Math.sin(TAU * t + d.p);
    ctx.fillStyle = `rgba(${CY},${d.a * 0.55})`; ctx.beginPath(); ctx.arc(x, y, d.r, 0, TAU); ctx.fill();
  });

  // ───── 측정 패널 ─────
  ctx.globalCompositeOperation = 'source-over';
  const dim = 1 - 0.55 * sstep(0.72, 0.8, t) * (1 - sstep(0.9, 0.96, t)); // 인증 순간엔 패널을 살짝 어둡게
  ctx.fillStyle = 'rgba(255,255,255,0.06)'; rr(PX, PY, PW, PH, 26); ctx.fill();
  ctx.strokeStyle = `rgba(${CY},0.4)`; ctx.lineWidth = 2; rr(PX, PY, PW, PH, 26); ctx.stroke();
  ctx.save(); ctx.globalAlpha = dim;
  // 헤더(점 3개 + 라인)
  [0, 1, 2].forEach((i) => { ctx.fillStyle = `rgba(${CY},${0.55 - i * 0.12})`; ctx.beginPath(); ctx.arc(PX + 34 + i * 22, PY + 32, 6, 0, TAU); ctx.fill(); });
  ctx.fillStyle = 'rgba(255,255,255,0.12)'; rr(PX + 150, PY + 26, 220, 12, 6); ctx.fill();

  // 파형 영역
  const WX = PX + 28, WY = PY + 70, WW = 330, WH = 170;
  ctx.fillStyle = 'rgba(4,16,42,0.45)'; rr(WX, WY, WW, WH, 14); ctx.fill();
  ctx.strokeStyle = 'rgba(125,200,255,0.12)'; ctx.lineWidth = 1;
  for (let i = 1; i < 6; i++) { ctx.beginPath(); ctx.moveTo(WX, WY + i * WH / 6); ctx.lineTo(WX + WW, WY + i * WH / 6); ctx.stroke(); }
  for (let i = 1; i < 8; i++) { ctx.beginPath(); ctx.moveTo(WX + i * WW / 8, WY); ctx.lineTo(WX + i * WW / 8, WY + WH); ctx.stroke(); }
  ctx.save(); ctx.beginPath(); ctx.rect(WX, WY, WW, WH); ctx.clip();
  ctx.setLineDash([6, 6]); ctx.strokeStyle = `rgba(${GR},0.5)`; ctx.beginPath(); ctx.moveTo(WX, WY + 48); ctx.lineTo(WX + WW, WY + 48); ctx.stroke(); ctx.setLineDash([]);
  const amp = 0.55 + 0.45 * sstep(0.0, 0.5, t) * (1 - sstep(0.7, 0.95, t));
  for (const [lw, al, shift] of [[7, 0.18, 0], [2.4, 1, 0], [1.4, 0.5, 40]]) {
    ctx.strokeStyle = `rgba(${shift ? BL : CY},${al})`; ctx.lineWidth = lw; ctx.beginPath();
    for (let x = 0; x <= WW; x += 3) {
      const u = (x + shift) / WW;
      const y = WY + WH / 2 + amp * (Math.sin(TAU * (3 * u + 2 * t)) * 44 + Math.sin(TAU * (8 * u - 3 * t)) * 16 + Math.sin(TAU * (1 * u + t)) * 14);
      x ? ctx.lineTo(WX + x, y) : ctx.moveTo(WX + x, y);
    }
    ctx.stroke();
  }
  ctx.restore();

  // 게이지
  const GX = PX + PW - 100, GY = WY + WH / 2, GRAD = 62;
  const gv = sstep(0.1, 0.7, t) * 0.92;
  ctx.lineCap = 'round'; ctx.lineWidth = 10;
  ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.beginPath(); ctx.arc(GX, GY, GRAD, TAU * 0.375, TAU * 1.125); ctx.stroke();
  ctx.strokeStyle = `rgba(${gv > 0.85 ? GR : CY},${0.95 * gA + 0.05})`;
  ctx.beginPath(); ctx.arc(GX, GY, GRAD, TAU * 0.375, TAU * (0.375 + 0.75 * gv)); ctx.stroke();
  ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(125,200,255,0.35)';
  for (let k = 0; k <= 20; k++) { const a = TAU * (0.375 + 0.75 * k / 20), r1 = GRAD + 16, r2 = r1 + (k % 5 ? 5 : 10); ctx.beginPath(); ctx.moveTo(GX + Math.cos(a) * r1, GY + Math.sin(a) * r1); ctx.lineTo(GX + Math.cos(a) * r2, GY + Math.sin(a) * r2); ctx.stroke(); }
  ctx.fillStyle = 'rgba(255,255,255,0.14)'; rr(GX - 24, GY - 6, 48, 12, 6); ctx.fill();

  // 점검 항목 5개
  ctx.globalAlpha = dim * gA;
  const RX = PX + 34, RY = PY + 276;
  ROW_T.forEach((t0, i) => {
    const y = RY + i * 58, p = sstep(t0, t0 + 0.07, t), done = p >= 1;
    // 값 자리표시 선
    ctx.fillStyle = 'rgba(255,255,255,0.10)'; rr(RX + 50, y - 6, 300, 12, 6); ctx.fill();
    const fg = ctx.createLinearGradient(RX + 50, 0, RX + 50 + 300 * BARW[i], 0);
    fg.addColorStop(0, `rgba(${CY},0.95)`); fg.addColorStop(1, `rgba(${GR},0.95)`);
    ctx.fillStyle = fg; rr(RX + 50, y - 6, Math.max(0.1, 300 * BARW[i] * p), 12, 6); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.14)'; rr(RX + 370, y - 6, 64 + (i % 3) * 14, 12, 6); ctx.fill();
    // 원형 체크박스
    ctx.lineWidth = 3; ctx.strokeStyle = done ? `rgba(${GR},1)` : `rgba(${CY},0.6)`;
    ctx.fillStyle = `rgba(${GR},${0.25 * p})`; ctx.beginPath(); ctx.arc(RX + 14, y, 15, 0, TAU); ctx.fill(); ctx.stroke();
    if (p > 0) {
      const q = sstep(0, 1, p); ctx.strokeStyle = `rgba(${WH},${q})`; ctx.lineWidth = 3.4; ctx.lineJoin = 'round';
      const pts = [[RX + 7, y + 1], [RX + 12, y + 7], [RX + 22, y - 6]];
      const L1 = 7.8, L2 = 15.6, tot = L1 + L2, d = tot * q;
      ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
      if (d <= L1) { const u = d / L1; ctx.lineTo(pts[0][0] + (pts[1][0] - pts[0][0]) * u, pts[0][1] + (pts[1][1] - pts[0][1]) * u); }
      else { const u = (d - L1) / L2; ctx.lineTo(pts[1][0], pts[1][1]); ctx.lineTo(pts[1][0] + (pts[2][0] - pts[1][0]) * u, pts[1][1] + (pts[2][1] - pts[1][1]) * u); }
      ctx.stroke();
    }
  });
  // 전체 진행 바
  const ov = sstep(0.12, 0.72, t);
  ctx.fillStyle = 'rgba(255,255,255,0.10)'; rr(PX + 34, PY + PH - 58, PW - 68, 14, 7); ctx.fill();
  const og = ctx.createLinearGradient(PX + 34, 0, PX + PW - 34, 0); og.addColorStop(0, `rgba(${CY},1)`); og.addColorStop(1, `rgba(${GR},1)`);
  ctx.fillStyle = og; rr(PX + 34, PY + PH - 58, Math.max(0.1, (PW - 68) * ov), 14, 7); ctx.fill();
  ctx.restore();
  ctx.globalAlpha = 1;

  // ───── 스캔 라인 (패널 위를 한 번 통과) ─────
  const sc = (t - 0.08) / 0.62;
  if (sc > 0 && sc < 1) {
    const sy = PY + 10 + sc * (PH - 20);
    ctx.save(); rr(PX, PY, PW, PH, 26); ctx.clip(); ctx.globalCompositeOperation = 'lighter';
    const sg = ctx.createLinearGradient(0, sy - 90, 0, sy);
    sg.addColorStop(0, `rgba(${CY},0)`); sg.addColorStop(1, `rgba(${CY},0.28)`);
    ctx.fillStyle = sg; ctx.fillRect(PX, sy - 90, PW, 90);
    ctx.fillStyle = `rgba(215,245,255,0.95)`; ctx.fillRect(PX, sy - 1, PW, 2.5);
    ctx.restore();
  }

  // ───── 인증 완료: 방패 + 체크 + 번지는 링 ─────
  const sx = PX + PW / 2, sy2 = PY + PH / 2 - 10;
  const q = sstep(0.74, 0.82, t) * (1 - sstep(0.93, 0.985, t));
  if (q > 0) {
    const sc2 = 0.55 + 0.45 * easeOutBack(sstep(0.74, 0.84, t));
    ctx.globalCompositeOperation = 'lighter';
    glow(sx, sy2, 340 * sc2, CY, 0.3 * q);
    const u = clamp((t - 0.76) / 0.18);
    for (let k = 0; k < 2; k++) {
      const uu = clamp(u - k * 0.18); if (uu <= 0 || uu >= 1) continue;
      ctx.strokeStyle = `rgba(${CY},${0.7 * (1 - uu) * q})`; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(sx, sy2, 120 + 260 * uu, 0, TAU); ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.save(); ctx.translate(sx, sy2); ctx.scale(sc2, sc2); ctx.globalAlpha = q;
    const sh = new Path2D('M0,-130 L100,-86 V12 C100,84 48,122 0,146 C-48,122 -100,84 -100,12 V-86 Z');
    const fg = ctx.createLinearGradient(0, -130, 0, 146); fg.addColorStop(0, 'rgba(14,60,130,0.96)'); fg.addColorStop(1, 'rgba(6,28,80,0.96)');
    ctx.fillStyle = fg; ctx.fill(sh);
    ctx.strokeStyle = 'rgba(235,250,255,0.98)'; ctx.lineWidth = 7; ctx.lineJoin = 'round'; ctx.stroke(sh);
    const cp = sstep(0.8, 0.86, t);
    if (cp > 0) {
      const A = [-44, 6], B = [-12, 40], C = [50, -28], L1 = Math.hypot(B[0] - A[0], B[1] - A[1]), L2 = Math.hypot(C[0] - B[0], C[1] - B[1]), d = (L1 + L2) * cp;
      ctx.strokeStyle = `rgba(${GR},1)`; ctx.shadowColor = `rgba(${GR},0.9)`; ctx.shadowBlur = 24; ctx.lineWidth = 19; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath(); ctx.moveTo(A[0], A[1]);
      if (d <= L1) ctx.lineTo(A[0] + (B[0] - A[0]) * d / L1, A[1] + (B[1] - A[1]) * d / L1);
      else { const v = (d - L1) / L2; ctx.lineTo(B[0], B[1]); ctx.lineTo(B[0] + (C[0] - B[0]) * v, B[1] + (C[1] - B[1]) * v); }
      ctx.stroke(); ctx.shadowBlur = 0;
    }
    ctx.restore();
  }
  ctx.globalCompositeOperation = 'source-over';
}

function render(t) {
  drawScene(t);
  main.globalCompositeOperation = 'source-over'; main.filter = 'none'; main.globalAlpha = 1;
  main.drawImage(off, 0, 0);
  main.globalCompositeOperation = 'lighter'; main.filter = 'blur(14px)'; main.globalAlpha = 0.6;
  main.drawImage(off, 0, 0);
  main.filter = 'none'; main.globalAlpha = 1; main.globalCompositeOperation = 'source-over';
  const sh = main.createLinearGradient(0, 0, W * 0.62, 0);
  sh.addColorStop(0, 'rgba(3,10,32,0.68)'); sh.addColorStop(1, 'rgba(3,10,32,0)');
  main.fillStyle = sh; main.fillRect(0, 0, W, H);
  const vg = main.createRadialGradient(W / 2, H / 2, H * 0.5, W / 2, H / 2, H * 1.1);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.4)');
  main.fillStyle = vg; main.fillRect(0, 0, W, H);
}
window.render = render;
render(0);
</script></body></html>
