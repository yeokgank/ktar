<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#02030c}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
/* KTAR 히어로 영상 장면 (자체 제작). render(t) 는 t∈[0,1) 에서 완전히 반복된다.
   어두운 배경 + 네온 회로 트레이스가 원근으로 다가오는 장면, 흐르는 빛, 입자, 떠다니는 패널. 글자 없음. */
const W = 1920, H = 1080, TAU = Math.PI * 2;
const main = document.getElementById('c').getContext('2d');
const off = document.createElement('canvas'); off.width = W; off.height = H;
const ctx = off.getContext('2d');

let seed = 11;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const PAL = ['34,211,238', '59,130,246', '168,85,247', '244,114,182'];

const HOR = 230, F = 900, CAMH = 430, D = 1600, ZMAX = 5600, ZMIN = 330;
const mod = (a, n) => ((a % n) + n) % n;
function proj(x, y, z, cx) { const k = F / z; return [W / 2 + (x - cx) * k, HOR + (CAMH - y) * k, k]; }
const fog = (z) => Math.pow(Math.max(0, 1 - z / ZMAX), 1.6);

// 회로 번들: 평행선 여러 개가 같은 경로를 따라 진행 (경로는 한 타일(D)마다 반복)
const BUNDLES = Array.from({ length: 11 }, (_, i) => {
  const cx = -1700 + i * 340 + (rnd() - 0.5) * 120;
  const a = 150 + rnd() * 300, b = 700 + rnd() * 300, sl = 140 + rnd() * 120;
  const s = (rnd() < 0.5 ? -1 : 1) * (110 + rnd() * 120);
  const n = 3 + Math.floor(rnd() * 4);
  return {
    pts: [[0, 0], [a, 0], [a + sl, s], [b, s], [b + sl, 0], [D, 0]].map(([z, dx]) => [z, cx + dx]),
    n, gap: 15 + rnd() * 6, col: PAL[i % PAL.length], pulse: rnd(),
  };
});
function pathX(pts, z) {
  for (let i = 0; i < pts.length - 1; i++) {
    if (z <= pts[i + 1][0]) { const u = (z - pts[i][0]) / (pts[i + 1][0] - pts[i][0]); return pts[i][1] + (pts[i + 1][1] - pts[i][1]) * u; }
  }
  return pts[pts.length - 1][1];
}

const DOTS = Array.from({ length: 260 }, () => ({ x: (rnd() - 0.5) * 3600, y: rnd() * 520, z: rnd() * D * 3, c: PAL[Math.floor(rnd() * 4)], r: 1 + rnd() * 2 }));
const PANELS = Array.from({ length: 9 }, () => ({ x: (rnd() - 0.5) * 2600, y: 120 + rnd() * 320, z: rnd() * D, c: PAL[Math.floor(rnd() * 4)], rot: rnd() * TAU, s: 50 + rnd() * 50 }));
const RIBBONS = Array.from({ length: 10 }, (_, i) => ({ by: 120 + i * 48, A: 30 + rnd() * 70, c: 0.7 + rnd() * 1.1, m: 1 + (i % 2), p: rnd() * TAU }));

function seg(a, b, cx) { // 두 점을 투영, 근거리 클립. a,b = [x, zc]
  let [x1, z1] = a, [x2, z2] = b;
  if (z1 < ZMIN && z2 < ZMIN) return null;
  if (z1 < ZMIN) { const u = (ZMIN - z1) / (z2 - z1); x1 += (x2 - x1) * u; z1 = ZMIN; }
  if (z2 < ZMIN) { const u = (ZMIN - z2) / (z1 - z2); x2 += (x1 - x2) * u; z2 = ZMIN; }
  return [proj(x1, 0, z1, cx), proj(x2, 0, z2, cx), (z1 + z2) / 2];
}

function glowDot(x, y, r, col, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${col},${a})`); g.addColorStop(0.35, `rgba(${col},${a * 0.45})`); g.addColorStop(1, `rgba(${col},0)`);
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
}

function drawScene(t) {
  const cx = 90 * Math.sin(TAU * t); // 카메라 좌우 흔들림

  // 배경
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#02030c'); g.addColorStop(0.35, '#070a2e'); g.addColorStop(1, '#0a0830');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  [['59,130,246', 1500, 260, 700, 0.30], ['168,85,247', 700, 620, 620, 0.20], ['244,114,182', 1700, 760, 480, 0.14]].forEach(([c, x, y, r, a]) => glowDot(x, y, r, c, a));

  // 흐르는 빛 리본 (상단)
  RIBBONS.forEach((rb) => {
    const gr = ctx.createLinearGradient(0, 0, W, 0);
    gr.addColorStop(0, 'rgba(34,211,238,0)'); gr.addColorStop(0.35, 'rgba(59,130,246,0.55)');
    gr.addColorStop(0.7, 'rgba(168,85,247,0.55)'); gr.addColorStop(1, 'rgba(244,114,182,0)');
    ctx.strokeStyle = gr;
    for (const [w, al] of [[6, 0.12], [1.6, 0.7]]) {
      ctx.lineWidth = w; ctx.globalAlpha = al;
      ctx.beginPath();
      for (let x = 0; x <= W; x += 24) {
        const y = rb.by + rb.A * Math.sin(TAU * (rb.c * x / W + rb.m * t) + rb.p) * (0.4 + 0.6 * x / W);
        x ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  });

  // 회로 트레이스
  const tiles = Math.ceil(ZMAX / D) + 2;
  for (const bd of BUNDLES) {
    for (let li = 0; li < bd.n; li++) {
      const lo = (li - (bd.n - 1) / 2) * bd.gap;
      for (let n = 0; n < tiles; n++) {
        const base = n * D - t * D;
        for (let i = 0; i < bd.pts.length - 1; i++) {
          const s = seg([bd.pts[i][1] + lo, bd.pts[i][0] + base], [bd.pts[i + 1][1] + lo, bd.pts[i + 1][0] + base], cx);
          if (!s) continue;
          const al = fog(s[2]); if (al < 0.02) continue;
          const k = s[0][2];
          ctx.strokeStyle = `rgba(${bd.col},${al * 0.2})`; ctx.lineWidth = Math.min(14, 2 + k * 2.6);
          ctx.beginPath(); ctx.moveTo(s[0][0], s[0][1]); ctx.lineTo(s[1][0], s[1][1]); ctx.stroke();
          ctx.strokeStyle = `rgba(${bd.col},${Math.min(1, al * 1.3)})`; ctx.lineWidth = Math.min(4, 0.7 + k * 0.7);
          ctx.beginPath(); ctx.moveTo(s[0][0], s[0][1]); ctx.lineTo(s[1][0], s[1][1]); ctx.stroke();
        }
        // 노드 (번들 중앙선 꺾임점)
        if (li === 0) for (let i = 1; i < bd.pts.length - 1; i++) {
          const zc = bd.pts[i][0] + base; if (zc < ZMIN || zc > ZMAX) continue;
          const p = proj(bd.pts[i][1], 0, zc, cx), al = fog(zc);
          glowDot(p[0], p[1], Math.min(46, 6 + p[2] * 8), bd.col, Math.min(1, al * 1.4));
        }
        // 흐르는 빛 펄스 (루프당 2회전)
        const zp = mod(bd.pulse * D - 2 * t * D + li * 130, D);
        const zc = zp + base;
        if (zc >= ZMIN && zc <= ZMAX) {
          const p = proj(pathX(bd.pts, zp) + lo, 0, zc, cx);
          glowDot(p[0], p[1], Math.min(40, 7 + p[2] * 7), '255,255,255', Math.min(1, fog(zc) * 1.6));
          glowDot(p[0], p[1], Math.min(70, 14 + p[2] * 12), bd.col, Math.min(0.9, fog(zc) * 1.2));
        }
      }
    }
  }

  // 떠다니는 패널(회전하는 사각 테두리)
  PANELS.forEach((pn) => {
    for (let n = 0; n < tiles; n++) {
      const zc = pn.z + n * D - t * D; if (zc < ZMIN + 200 || zc > ZMAX) continue;
      const p = proj(pn.x, pn.y, zc, cx), r = pn.s * p[2] * 0.55, al = fog(zc);
      ctx.save(); ctx.translate(p[0], p[1]); ctx.rotate(pn.rot + TAU * t);
      ctx.strokeStyle = `rgba(${pn.c},${al * 0.9})`; ctx.lineWidth = Math.max(1, p[2] * 1.2);
      ctx.strokeRect(-r, -r, r * 2, r * 2);
      ctx.fillStyle = `rgba(${pn.c},${al * 0.12})`; ctx.fillRect(-r, -r, r * 2, r * 2);
      ctx.restore();
    }
  });

  // 입자 / 보케
  DOTS.forEach((d) => {
    const zc = mod(d.z - t * 3 * D, D * 3); if (zc < ZMIN || zc > ZMAX) return;
    const p = proj(d.x, d.y, zc, cx), al = fog(zc);
    if (p[0] < -50 || p[0] > W + 50 || p[1] < -50 || p[1] > H + 50) return;
    if (p[2] > 2.2) glowDot(p[0], p[1], 10 + p[2] * 6, d.c, al * 0.5);
    else { ctx.fillStyle = `rgba(${d.c},${al})`; ctx.beginPath(); ctx.arc(p[0], p[1], d.r * Math.max(0.8, p[2] * 0.8), 0, TAU); ctx.fill(); }
  });

  // 우측 코어(글자 없는 홀로그램 링)
  const kx = 1440, ky = 470;
  glowDot(kx, ky, 380, '59,130,246', 0.35);
  [[210, 1, '34,211,238'], [150, -2, '168,85,247'], [96, 3, '244,114,182']].forEach(([r, f, c], i) => {
    const pulse = 0.5 + 0.5 * Math.sin(TAU * (t * (i + 1)));
    ctx.strokeStyle = `rgba(${c},${0.35 + 0.3 * pulse})`; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(kx, ky, r + 6 * pulse, 0, TAU); ctx.stroke();
    const a0 = TAU * f * t + i; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.strokeStyle = `rgba(${c},0.95)`;
    ctx.beginPath(); ctx.arc(kx, ky, r - 14, a0, a0 + TAU * 0.2); ctx.stroke();
    ctx.lineWidth = 1; ctx.strokeStyle = `rgba(${c},0.4)`;
    for (let k = 0; k < 40; k++) {
      const a = (k / 40) * TAU, r1 = r - 34, r2 = r - (k % 5 ? 42 : 52);
      ctx.beginPath(); ctx.moveTo(kx + Math.cos(a) * r1, ky + Math.sin(a) * r1); ctx.lineTo(kx + Math.cos(a) * r2, ky + Math.sin(a) * r2); ctx.stroke();
    }
  });
  glowDot(kx, ky, 70, '255,255,255', 0.9);

  ctx.globalCompositeOperation = 'source-over';
}

function render(t) {
  drawScene(t);
  main.globalCompositeOperation = 'source-over'; main.filter = 'none'; main.globalAlpha = 1;
  main.drawImage(off, 0, 0);
  // 블룸
  main.globalCompositeOperation = 'lighter'; main.filter = 'blur(16px)'; main.globalAlpha = 0.75;
  main.drawImage(off, 0, 0);
  main.filter = 'none'; main.globalAlpha = 1; main.globalCompositeOperation = 'source-over';
  // 좌측 텍스트 가독성
  const sh = main.createLinearGradient(0, 0, W * 0.65, 0);
  sh.addColorStop(0, 'rgba(2,3,12,0.7)'); sh.addColorStop(1, 'rgba(2,3,12,0)');
  main.fillStyle = sh; main.fillRect(0, 0, W, H);
  const vg = main.createRadialGradient(W / 2, H / 2, H * 0.5, W / 2, H / 2, H * 1.1);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.45)');
  main.fillStyle = vg; main.fillRect(0, 0, W, H);
}
window.render = render;
render(0);
</script></body></html>
